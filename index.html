<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokeSearch">
<meta name="theme-color" content="#EE1515">
<title>PokeSearch</title>
<style>
/* ── CSS custom properties (light theme) ── */
:root {
  --bg: #f0f0f0;
  --card: #ffffff;
  --card2: #f7f7f7;
  --text: #1a1a1a;
  --text2: #555;
  --text3: #999;
  --border: #e0e0e0;
  --border2: #d0d0d0;
  --input-bg: #fff;
  --chip-bg: #f7f7f7;
  --chip-neg: #fff0f0;
  --group1: #f8f4ff;
  --group1b: #c8b0f0;
  --group2: #f0f8ff;
  --group2b: #a8d0f0;
  --empty: #ccc;
  --surface: #fff;
  --modal: #fff;
  --modal-foot: #fff;
  --sep: #e0e0e0;
  --tag-bg: #EE1515;
  --shadow: rgba(0,0,0,.08);
}
[data-theme="dark"] {
  --bg: #121212;
  --card: #1e1e1e;
  --card2: #2a2a2a;
  --text: #f0f0f0;
  --text2: #aaa;
  --text3: #666;
  --border: #333;
  --border2: #444;
  --input-bg: #2a2a2a;
  --chip-bg: #2a2a2a;
  --chip-neg: #3a1515;
  --group1: #1e1a2e;
  --group1b: #6040a0;
  --group2: #1a1e2e;
  --group2b: #406080;
  --empty: #555;
  --surface: #1e1e1e;
  --modal: #1e1e1e;
  --modal-foot: #1e1e1e;
  --sep: #333;
  --shadow: rgba(0,0,0,.3);
}
/* ── Reset & base ── */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:background .2s,color .2s}
/* ── Top bar ── */
.topbar{position:sticky;top:0;z-index:100;background:#EE1515;color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.topbar-left .t1{font-size:20px;font-weight:700}
.topbar-left .t2{font-size:11px;opacity:.85}
.topbar-btns{display:flex;gap:4px}
.topbar-btn{background:none;border:none;color:#fff;cursor:pointer;padding:8px;border-radius:50%;font-size:20px;line-height:1;display:flex;align-items:center;justify-content:center;transition:background .15s}
.topbar-btn:hover{background:rgba(255,255,255,.15)}
/* ── Main ── */
.main{padding:16px;display:flex;flex-direction:column;gap:16px;max-width:640px;margin:0 auto;padding-bottom:80px}
.card{background:var(--card);border-radius:12px;padding:16px;box-shadow:0 1px 4px var(--shadow);transition:background .2s}
.card-title{font-size:14px;font-weight:700;color:#EE1515;margin-bottom:10px}
.hint{font-size:13px;color:var(--text2);margin-bottom:10px}
/* ── Paste ── */
.paste-row{display:flex;gap:8px;align-items:flex-start}
.paste-input{flex:1;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:14px;font-family:monospace;outline:none;background:var(--input-bg);color:var(--text);min-width:0;transition:border-color .15s,background .2s}
.paste-input:focus{border-color:#EE1515}
.btn-red{background:#EE1515;color:#fff;border:none;padding:10px 16px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;flex-shrink:0}
.btn-red:hover{background:#c91010}
.btn-red:disabled{opacity:.4;cursor:not-allowed}
hr{border:none;border-top:1px solid var(--sep)}
/* ── Tree ── */
.tree-empty{color:var(--text3);font-size:14px;text-align:center;padding:20px 0}
.tree-root{display:flex;flex-direction:column}
.root-hdr{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.root-lbl{font-size:12px;color:var(--text3);flex:1}
.op-chip{border:none;cursor:pointer;font-size:11px;font-weight:700;padding:4px 12px;border-radius:20px;letter-spacing:.5px;user-select:none;transition:opacity .15s}
.op-chip.or{background:#FFCB05;color:#1a1a1a}
.op-chip.and{background:#3B4CCA;color:#fff}
.op-chip:hover{opacity:.8}
.sep-row{display:flex;align-items:center;gap:6px;padding:2px 0}
.sep-line{flex:1;height:1px;background:var(--border)}
.sep-chip{border:none;cursor:pointer;font-size:11px;font-weight:700;padding:3px 12px;border-radius:20px;letter-spacing:.5px;user-select:none;transition:opacity .15s}
.sep-chip.or{background:#FFCB05;color:#1a1a1a}
.sep-chip.and{background:#3B4CCA;color:#fff}
.sep-chip:hover{opacity:.8}
.child-row{display:flex;align-items:flex-start;gap:4px;padding:3px 0}
.reorder-col{display:flex;flex-direction:column;gap:2px;padding-top:6px;flex-shrink:0}
.rbtn{background:none;border:1px solid var(--border);border-radius:5px;width:22px;height:22px;font-size:13px;cursor:pointer;color:var(--text2);padding:0;display:flex;align-items:center;justify-content:center;transition:background .1s}
.rbtn:hover{background:var(--card2)}
.rbtn-ph{width:22px;height:22px}
.child-body{flex:1;min-width:0}
/* ── Filter chip ── */
.fc{background:var(--chip-bg);border:1.5px solid var(--border);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px;transition:background .2s,border-color .2s}
.fc.neg{background:var(--chip-neg);border-color:#EE1515}
.fc-label{flex:1;font-size:14px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.fc.neg .fc-label{color:#e03030}
.fc-btns{display:flex;gap:3px;flex-shrink:0}
/* ── Group node ── */
.gn{border:1.5px solid var(--border2);border-radius:10px;padding:10px;background:var(--card);transition:background .2s,border-color .2s}
.gn.d1{background:var(--group1);border-color:var(--group1b)}
.gn.d2{background:var(--group2);border-color:var(--group2b)}
.gn.neg{border-color:#EE1515}
.gn-hdr{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.gn-hdr-space{flex:1}
.children-list{display:flex;flex-direction:column}
.group-acts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.empty-hint{color:var(--empty);font-size:13px;text-align:center;padding:10px 0}
/* ── Buttons ── */
.btn-sm{border:none;padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;transition:background .15s}
.btn-sm.red{background:#EE1515;color:#fff}
.btn-sm.red:hover{background:#c91010}
.btn-sm.out{background:var(--card);color:#3B4CCA;border:1.5px solid #3B4CCA}
.btn-sm.out:hover{background:var(--group2)}
.not-btn{background:none;border:1.5px solid var(--border2);border-radius:4px;padding:2px 6px;font-size:11px;font-weight:700;color:var(--text3);cursor:pointer;transition:background .1s,border-color .1s}
.not-btn.on{background:#EE1515;border-color:#EE1515;color:#fff}
.not-btn:hover{border-color:#EE1515}
.ibtn{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 7px;font-size:13px;cursor:pointer;color:var(--text2);transition:background .1s}
.ibtn:hover{background:var(--card2)}
.ibtn.del{color:#c00}
.ibtn.del:hover{background:var(--chip-neg);border-color:#c00}
/* ── Output ── */
.out-hdr{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.out-hdr .card-title{margin-bottom:0;flex:1}
.out-box{background:var(--card2);border-radius:8px;padding:12px;font-family:monospace;font-size:15px;min-height:48px;word-break:break-all;line-height:1.5;color:var(--text);transition:background .2s}
.out-ph{color:var(--text3);font-size:14px}
.char-ct{font-size:11px;color:var(--text3);margin-top:6px}
/* ── Modal ── */
.modal-ov{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55)}
.modal-ov.open{display:flex;flex-direction:column;justify-content:flex-end}
.modal-sheet{background:var(--modal);border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column;overflow:hidden;transition:background .2s}
.modal-hdr{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--sep);flex-shrink:0}
.modal-hdr h2{flex:1;font-size:17px;font-weight:700;color:var(--text)}
.modal-body{flex:1;overflow-y:auto;padding:14px 16px}
.modal-foot{padding:14px 16px;border-top:1px solid var(--sep);display:flex;gap:8px;flex-shrink:0;background:var(--modal-foot)}
/* ── Category tabs ── */
.cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cat-tab{padding:5px 10px;border-radius:20px;border:1.5px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;color:var(--text2);transition:all .15s}
.cat-tab.on{background:#EE1515;border-color:#EE1515;color:#fff}
.cat-tab:hover:not(.on){border-color:#EE1515;color:#EE1515}
/* ── Filter list ── */
.fopt{display:block;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);cursor:pointer;margin-bottom:8px;transition:all .15s}
.fopt:hover{border-color:#EE1515;background:var(--chip-neg)}
.fopt-name{display:block;font-size:14px;font-weight:600;color:var(--text)}
.fopt-desc{display:block;font-size:12px;color:var(--text2);margin-top:2px}
/* ── Value editor ── */
.def-desc{font-size:13px;color:var(--text2);margin-bottom:14px}
.val-hint{font-size:13px;color:var(--text2);padding:12px 0}
.txt-inp{width:100%;padding:10px 12px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;font-family:monospace;margin-bottom:12px;outline:none;background:var(--input-bg);color:var(--text);transition:border-color .15s,background .2s}
.txt-inp:focus{border-color:#EE1515}
.range-row{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.range-grp{flex:1}
.range-grp label{display:block;font-size:12px;color:var(--text2);margin-bottom:4px}
.num-inp{width:100%;padding:8px 10px;border:1.5px solid var(--border);border-radius:8px;font-size:15px;outline:none;background:var(--input-bg);color:var(--text);transition:border-color .15s,background .2s}
.num-inp:focus{border-color:#EE1515}
.range-dash{font-size:20px;color:var(--text3);padding-bottom:6px}
.enum-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.eopt{padding:10px 14px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);text-align:left;cursor:pointer;font-size:14px;color:var(--text);transition:all .15s}
.eopt.on{background:#EE1515;border-color:#EE1515;color:#fff;font-weight:600}
.eopt:hover:not(.on){border-color:#EE1515}
.neg-row{padding:6px 0}
.chk-lbl{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer;color:var(--text)}
/* ── Modal footer ── */
.btn-cancel{flex:1;padding:12px;border:1.5px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);font-size:14px;cursor:pointer;transition:background .1s}
.btn-cancel:hover{background:var(--card2)}
.btn-confirm{flex:2;padding:12px;background:#EE1515;color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer}
.btn-confirm:hover{background:#c91010}
/* ── Toast ── */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:24px;font-size:14px;z-index:500;pointer-events:none;opacity:0;transition:opacity .2s;white-space:nowrap}
.toast.show{opacity:1}
</style>
</head>
<body>
<div id="app"></div>

<script>
'use strict';

// ─── Theme ────────────────────────────────────────────────────────────────

let themeMode = localStorage.getItem('themeMode') || 'system';

function applyTheme() {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const dark = themeMode === 'dark' || (themeMode === 'system' && prefersDark);
  document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
}

function cycleTheme() {
  themeMode = themeMode === 'system' ? 'dark' : themeMode === 'dark' ? 'light' : 'system';
  localStorage.setItem('themeMode', themeMode);
  applyTheme();
  render();
}

window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);
applyTheme();

  {id:'year',n:'Year Caught',cat:'TEMPORAL',vt:'NUM',desc:'Calendar year caught',tok:'year'},
  // Encounter
  {id:'raid',n:'Caught in Raid',cat:'ENCOUNTER',vt:'BOOL',desc:'Was caught from any raid'},
  {id:'remoteraid',n:'Remote Raid',cat:'ENCOUNTER',vt:'BOOL',desc:'Was caught from a Remote Raid',tok:'remoteraid'},
  {id:'megaraid',n:'Mega Raid',cat:'ENCOUNTER',vt:'BOOL',desc:'Was caught from a Mega Raid',tok:'megaraid'},
  {id:'exraid',n:'EX Raid',cat:'ENCOUNTER',vt:'BOOL',desc:'Was caught from an EX Raid',tok:'exraid'},
  {id:'primalraid',n:'Primal Raid',cat:'ENCOUNTER',vt:'BOOL',desc:'Was caught from a Primal Raid',tok:'primalraid'},
  {id:'research',n:'Field Research',cat:'ENCOUNTER',vt:'BOOL',desc:'Was a Field/Special Research reward'},
  {id:'gbl',n:'GO Battle League',cat:'ENCOUNTER',vt:'BOOL',desc:'Was a GO Battle League reward'},
  {id:'rocket',n:'Team GO Rocket',cat:'ENCOUNTER',vt:'BOOL',desc:'Was rescued from Team GO Rocket'},
  {id:'snapshot',n:'GO Snapshot',cat:'ENCOUNTER',vt:'BOOL',desc:'Was encountered via AR Snapshot'}
];

// Build lookup maps
const BOOL_BY_TOK = {};
const ENUM_BY_OPT = {};

DEFS.forEach(def => {
  if (def.vt === 'BOOL') {
    const tok = (def.tok !== undefined ? def.tok : def.id) || def.id;
    if (!tok.startsWith('@') && !tok.startsWith('#') && tok) {
      BOOL_BY_TOK[tok] = def;
    }
  }
  if (def.vt === 'ENUM' && def.opts) {
    def.opts.forEach(o => { ENUM_BY_OPT[o.k] = def; });
  }
});

function findDef(id) { return DEFS.find(d => d.id === id); }

const GEN_ALIASES = {
  kanto:'gen1',johto:'gen2',hoenn:'gen3',sinnoh:'gen4',unova:'gen5',
  kalos:'gen6',alola:'gen7',galar:'gen8',paldea:'gen9'
};

// ─── Tree Helpers ──────────────────────────────────────────────────────────

let _nid = 0;
function gid() { return 'n' + (++_nid); }

function emptyRoot() { return {id:'root',tp:'G',op:'OR',ch:[],neg:false}; }

function mkFilter(defId, val, neg=false) { return {id:gid(),tp:'F',defId,val,neg}; }
function mkGroup(op='AND') { return {id:gid(),tp:'G',op,ch:[],neg:false}; }

function defVal(def) {
  switch(def.vt){
    case 'BOOL': return {t:'bool'};
    case 'TEXT': return {t:'text',v:''};
    case 'NUM':  return {t:'num',min:null,max:null};
    case 'ENUM': return {t:'enum',k:def.opts[0].k};
    case 'PDX':  return {t:'pdx',s:1,e:null};
  }
}

// ─── Tree Operations ───────────────────────────────────────────────────────

function addChild(g, parentId, child) {
  if (g.id===parentId) return {...g, ch:[...g.ch, child]};
  return {...g, ch:g.ch.map(c => c.tp==='G' ? addChild(c,parentId,child) : c)};
}

function removeNode(g, tid) {
  return {...g, ch:g.ch.filter(c=>c.id!==tid).map(c=>c.tp==='G'?removeNode(c,tid):c)};
}

function replaceNode(g, tid, fn) {
  if (g.id===tid) return fn(g);
  return {...g, ch:g.ch.map(c=>{
    if (c.id===tid) return fn(c);
    if (c.tp==='G') return replaceNode(c,tid,fn);
    return c;
  })};
}

function reorderIn(g, nid, toIdx) {
  const i=g.ch.findIndex(c=>c.id===nid);
  if (i>=0){
    const cl=Math.max(0,Math.min(toIdx,g.ch.length-1));
    if (cl===i) return g;
    const list=[...g.ch];const [item]=list.splice(i,1);list.splice(cl,0,item);
    return {...g,ch:list};
  }
  return {...g,ch:g.ch.map(c=>c.tp==='G'?reorderIn(c,nid,toIdx):c)};
}

function findNode(g, id) {
  if (g.id===id) return g;
  for (const c of g.ch){if(c.id===id)return c;if(c.tp==='G'){const f=findNode(c,id);if(f)return f;}}
  return null;
}

function findIdx(g, nid) {
  const i=g.ch.findIndex(c=>c.id===nid);if(i>=0)return i;
  for(const c of g.ch){if(c.tp==='G'){const x=findIdx(c,nid);if(x>=0)return x;}}
  return -1;
}

function countFilters(n){return n.tp==='F'?1:n.ch.reduce((s,c)=>s+countFilters(c),0);}

// ─── Serializer ────────────────────────────────────────────────────────────

function serRoot(root){
  if(!root.ch.length) return '';
  const sep=root.op==='AND'?'&':',';
  return root.ch.map(c=>serNode(c)).join(sep);
}

function serNode(n){ return n.tp==='F'?serFilter(n):serGroup(n,false); }

function serGroup(g,isRoot){
  if(!g.ch.length) return '';
  const sep=g.op==='AND'?'&':',';
  const inner=g.ch.map(c=>serNode(c)).join(sep);
  const wrap=(isRoot||(!g.neg&&g.ch.length===1))?inner:`(${inner})`;
  return g.neg?`!${wrap}`:wrap;
}

function serFilter(n){
  const def=findDef(n.defId);
  const s=serTok(def,n.val);
  return n.neg?`!${s}`:s;
}

function serTok(def,val){
  switch(def.id){
    case 'name':    return val.v||'';
    case 'pokedex': return val.e!=null?`#${val.s}-${val.e}`:`#${val.s}`;
    case 'type':case'generation':case'gender':case'egg_km':case'buddy_level':
    case'stars':case'mega_level':case'pokemon_size': return val.k;
    case 'cp':       return numStr('cp',val);
    case 'hp':       return numStr('hp',val);
    case 'atk':      return numStr('atk',val);
    case 'def':      return numStr('def',val);
    case 'sta':      return numStr('sta',val);
    case 'level':    return numStr('level',val);
    case 'age':      return numStr('age',val);
    case 'year':     return numStr('year',val);
    case 'distance': return numStr('distance',val);
    case 'weak_to':          return `<${val.v}`;
    case 'strong_against':   return `>${val.v}`;
    case 'move':             return `@${val.v}`;
    case 'quick_move_type':  return `@1${val.v}`;
    case 'charge_move_type': return `@2${val.v}`;
    case 'legacy_move':   return '@legacy';
    case 'elite_move':    return '@elite';
    case 'special_move':  return '@special';
    case 'purified_move': return '@purified';
    case 'tag':      return `#${val.v}`;
    case 'favorite': return 'favorite';
    case 'raw':      return val.v||'';
    default: return (def.tok!==undefined&&def.tok!==''&&!def.tok.startsWith('@')&&!def.tok.startsWith('#'))?def.tok:def.id;
  }
}

function numStr(p,val){
  const{min,max}=val;
  if(min!=null&&max!=null&&min===max)return`${p}${min}`;
  if(min!=null&&max!=null)return`${p}${min}-${max}`;
  if(min!=null)return`${p}${min}-`;
  if(max!=null)return`${p}-${max}`;
  return p;
}

function filterLabel(defId,val){
  const def=findDef(defId);
  switch(val.t){
    case 'bool': return def.n;
    case 'text': return val.v?`${def.n}: ${val.v}`:def.n;
    case 'enum': {const o=(def.opts||[]).find(x=>x.k===val.k);return `${def.n}: ${o?o.l:val.k}`;}
    case 'num': {
      const{min,max}=val;
      if(min!=null&&max!=null&&min===max)return`${def.n} = ${min}`;
      if(min!=null&&max!=null)return`${def.n}: ${min}–${max}`;
      if(min!=null)return`${def.n} ≥ ${min}`;
      if(max!=null)return`${def.n} ≤ ${max}`;
      return def.n;
    }
    case 'pdx': return val.e!=null?`Pokédex #${val.s}–${val.e}`:`Pokédex #${val.s}`;
  }
}

// ─── Parser ────────────────────────────────────────────────────────────────

class Parser {
  parse(input){
    this.s=input.trim();this.p=0;
    if(!this.s)return emptyRoot();
    return this.wrap(this.parseOr());
  }
  parseOr(){
    const left=this.parseAnd();
    if(this.peek()!==',')return left;
    const ch=[left];
    while(this.peek()===','){this.adv();ch.push(this.parseAnd());}
    return{id:gid(),tp:'G',op:'OR',ch,neg:false};
  }
  parseAnd(){
    const left=this.parseUn();
    if(this.peek()!=='&')return left;
    const ch=[left];
    while(this.peek()==='&'){this.adv();ch.push(this.parseUn());}
    return{id:gid(),tp:'G',op:'AND',ch,neg:false};
  }
  parseUn(){
    this.ws();
    if(this.peek()==='!'){this.adv();const c=this.parsePrim();return{...c,neg:true};}
    return this.parsePrim();
  }
  parsePrim(){
    this.ws();
    if(this.peek()==='('){
      this.adv();const expr=this.parseOr();this.ws();if(this.peek()===')')this.adv();
      if(expr.tp==='G')return expr;
      return{id:gid(),tp:'G',op:'AND',ch:[expr],neg:false};
    }
    return this.parseTok();
  }
  parseTok(){
    this.ws();const start=this.p;
    const ops=new Set(['&',',','(',')',`!`]);
    while(this.p<this.s.length&&!ops.has(this.s[this.p]))this.p++;
    return this.buildNode(this.s.slice(start,this.p).trim());
  }
  buildNode(token){
    const id=gid(),lo=token.toLowerCase();
    if(!token)return{id,tp:'F',defId:'raw',val:{t:'text',v:''},neg:false};
    // Pokédex
    if(/^#\d+(-\d+)?$/.test(lo)){
      const inner=token.slice(1),di=inner.indexOf('-');
      let s,e;
      if(di<0){s=parseInt(inner)||1;e=null;}
      else{s=parseInt(inner.slice(0,di))||1;e=parseInt(inner.slice(di+1))||null;}
      return{id,tp:'F',defId:'pokedex',val:{t:'pdx',s,e},neg:false};
    }
    // IV stars
    if(/^[0-4]\*$/.test(lo))return{id,tp:'F',defId:'stars',val:{t:'enum',k:lo},neg:false};
    // Numeric ranges
    const numPfx=[['cp','cp'],['hp','hp'],['atk','atk'],['def','def'],['sta','sta'],
                  ['level','level'],['age','age'],['year','year'],['distance','distance']];
    for(const[pfx,defId]of numPfx){
      if(new RegExp(`^${pfx}\\d*-?\\d*$`).test(lo))
        return{id,tp:'F',defId,val:this.numRange(lo.slice(pfx.length)),neg:false};
    }
    // Type advantage
    if(lo.length>1&&lo.startsWith('<'))return{id,tp:'F',defId:'weak_to',val:{t:'text',v:token.slice(1)},neg:false};
    if(lo.length>1&&lo.startsWith('>'))return{id,tp:'F',defId:'strong_against',val:{t:'text',v:token.slice(1)},neg:false};
    // Move filters
    if(lo.startsWith('@')){
      const mp=lo.slice(1);
      const moveMap={legacy:'legacy_move',elite:'elite_move',special:'special_move',purified:'purified_move'};
      if(moveMap[mp])return{id,tp:'F',defId:moveMap[mp],val:{t:'bool'},neg:false};
      if(mp.startsWith('1'))return{id,tp:'F',defId:'quick_move_type',val:{t:'text',v:token.slice(2)},neg:false};
      if(mp.startsWith('2')&&mp.slice(1)==='special')return{id,tp:'F',defId:'special_move',val:{t:'bool'},neg:false};
      if(mp.startsWith('2'))return{id,tp:'F',defId:'charge_move_type',val:{t:'text',v:token.slice(2)},neg:false};
      return{id,tp:'F',defId:'move',val:{t:'text',v:token.slice(1)},neg:false};
    }
    // Tags
    if(lo.startsWith('#')){
      const tp=lo.slice(1);
      if(tp==='favorite')return{id,tp:'F',defId:'favorite',val:{t:'bool'},neg:false};
      return{id,tp:'F',defId:'tag',val:{t:'text',v:token.slice(1)},neg:false};
    }
    // Generation aliases
    if(GEN_ALIASES[lo])return{id,tp:'F',defId:'generation',val:{t:'enum',k:GEN_ALIASES[lo]},neg:false};
    // Egg distances
    if(['2km','5km','7km','10km','12km'].includes(lo))
      return{id,tp:'F',defId:'egg_km',val:{t:'enum',k:lo},neg:false};
    // Buddy levels
    if(/^buddy[0-4]$/.test(lo))return{id,tp:'F',defId:'buddy_level',val:{t:'enum',k:lo},neg:false};
    // Boolean lookup
    if(BOOL_BY_TOK[lo])return{id,tp:'F',defId:BOOL_BY_TOK[lo].id,val:{t:'bool'},neg:false};
    // Enum lookup
    if(ENUM_BY_OPT[lo])return{id,tp:'F',defId:ENUM_BY_OPT[lo].id,val:{t:'enum',k:lo},neg:false};
    // Fallback: name
    return{id,tp:'F',defId:'name',val:{t:'text',v:token},neg:false};
  }
  numRange(inner){
    if(!inner)return{t:'num',min:null,max:null};
    if(inner.startsWith('-')){const v=parseInt(inner.slice(1));return{t:'num',min:null,max:isNaN(v)?null:v};}
    if(inner.endsWith('-')){const v=parseInt(inner.slice(0,-1));return{t:'num',min:isNaN(v)?null:v,max:null};}
    if(inner.includes('-')){
      const d=inner.indexOf('-');const a=parseInt(inner.slice(0,d)),b=parseInt(inner.slice(d+1));
      return{t:'num',min:isNaN(a)?null:a,max:isNaN(b)?null:b};
    }
    const v=parseInt(inner);return{t:'num',min:isNaN(v)?null:v,max:isNaN(v)?null:v};
  }
  wrap(node){
    if(node.tp==='G'){if(!node.neg)return{...node,id:'root'};return{id:'root',tp:'G',op:'OR',ch:[node],neg:false};}
    return{id:'root',tp:'G',op:'OR',ch:[node],neg:false};
  }
  peek(){this.ws();return this.p<this.s.length?this.s[this.p]:null;}
  adv(){this.p++;}
  ws(){while(this.p<this.s.length&&this.s[this.p]===' ')this.p++;}
}

const parser=new Parser();

  root:emptyRoot(), str:'',

};

// ─── HTML Escaping ─────────────────────────────────────────────────────────

function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Render ────────────────────────────────────────────────────────────────

}

function renderTree(){
  const root=ST.root;
  if(!root.ch.length){
    return`<div class="tree-root"><div class="tree-empty">No filters yet. Use the buttons below to start building.</div>${renderGroupActs(root.id)}</div>`;
  }
  return renderGroup(root,true,0);
}

function renderGroup(g,isRoot,depth){
  const opL=g.op==='AND'?'AND':'OR';
  const cls=isRoot?'tree-root':`gn d${(depth%2)+1}${g.neg?' neg':''}`;
  let hdr='';
  if(isRoot){
    hdr=`<div class="root-hdr"><span class="root-lbl">Root Group</span><button class="op-chip ${g.op.toLowerCase()}" data-a="tog-op" data-gid="${g.id}">${opL}</button></div>`;
  } else {
    hdr=`<div class="gn-hdr"><button class="not-btn${g.neg?' on':''}" data-a="tog-neg" data-nid="${g.id}">NOT</button><span class="gn-hdr-space"></span><button class="op-chip ${g.op.toLowerCase()}" data-a="tog-op" data-gid="${g.id}">${opL}</button><button class="ibtn del" data-a="remove" data-nid="${g.id}">✕</button></div>`;
  }
  let children='';
  g.ch.forEach((child,i)=>{
    if(i>0){
      children+=`<div class="sep-row"><div class="sep-line"></div><button class="sep-chip ${g.op.toLowerCase()}" data-a="tog-op" data-gid="${g.id}">${opL}</button><div class="sep-line"></div></div>`;
    }
    const isFirst=i===0,isLast=i===g.ch.length-1;
    children+=`<div class="child-row">
      <div class="reorder-col">
        ${isFirst?`<div class="rbtn-ph"></div>`:`<button class="rbtn" data-a="mv-up" data-nid="${child.id}">↑</button>`}
        ${isLast?`<div class="rbtn-ph"></div>`:`<button class="rbtn" data-a="mv-dn" data-nid="${child.id}">↓</button>`}
      </div>
      <div class="child-body">${child.tp==='F'?renderFilter(child):renderGroup(child,false,depth+1)}</div>
    </div>`;
  });
  const emptyHint=g.ch.length===0?'<div class="empty-hint">Empty group</div>':'';
  return`<div class="${cls}">${hdr}<div class="children-list">${children}${emptyHint}</div>${renderGroupActs(g.id)}</div>`;
}

function renderGroupActs(gid){
  return`<div class="group-acts"><button class="btn-sm red" data-a="add-filter" data-gid="${gid}">+ Filter</button><button class="btn-sm out" data-a="add-group" data-gid="${gid}">+ Group</button></div>`;
}

function renderValEditor(){
  const def=ST.shDef,val=ST.shVal;
  let ve='';
  switch(def.vt){
    case 'BOOL':
      ve=`<div class="val-hint">No value required — this is a presence/absence filter.</div>`;break;
    case 'TEXT':
      ve=`<input id="vi-txt" class="txt-inp" type="text" value="${esc(val.v||'')}" placeholder="Enter value…">`;break;

      ve=`<div class="range-row"><div class="range-grp"><label>Min</label><input id="vi-min" class="num-inp" type="number" value="${val.min!=null?val.min:''}" placeholder="any"></div><span class="range-dash">–</span><div class="range-grp"><label>Max</label><input id="vi-max" class="num-inp" type="number" value="${val.max!=null?val.max:''}" placeholder="any"></div></div>`;break;
    case 'ENUM':
      ve=`<div class="enum-list">${(def.opts||[]).map(o=>`<button class="eopt${val.k===o.k?' on':''}" data-a="pick-enum" data-k="${o.k}">${esc(o.l)}</button>`).join('')}</div>`;break;
    case 'PDX':
      ve=`<div class="range-row"><div class="range-grp"><label>Start #</label><input id="vi-ps" class="num-inp" type="number" value="${val.s||1}" min="1" max="999"></div><span class="range-dash">–</span><div class="range-grp"><label>End #</label><input id="vi-pe" class="num-inp" type="number" value="${val.e!=null?val.e:''}" placeholder="single" min="1" max="999"></div></div>`;break;
  }
  return`<div class="modal-hdr"><button class="ibtn" data-a="back-pick">←</button><h2>${esc(def.n)}</h2><button class="ibtn" data-a="close-sh">✕</button></div>
<div class="modal-body"><div class="def-desc">${esc(def.desc||'')}</div>${ve}<div class="neg-row"><label class="chk-lbl"><input id="vi-neg" type="checkbox" ${ST.shNeg?'checked':''}> NOT (negate this filter)</label></div></div>
<div class="modal-foot"><button class="btn-cancel" data-a="close-sh">Cancel</button><button class="btn-confirm" data-a="confirm">${ST.shMode==='add'?'Add Filter':'Save'}</button></div>`;
}

function collectVal(){
  const def=ST.shDef;
  const neg=document.getElementById('vi-neg')?.checked||false;
  let val=ST.shVal;
  switch(def.vt){
    case 'BOOL':val={t:'bool'};break;
    case 'TEXT':{const e=document.getElementById('vi-txt');val={t:'text',v:e?e.value:''};break;}
    case 'NUM':{
      const mn=document.getElementById('vi-min'),mx=document.getElementById('vi-max');
      const a=mn&&mn.value!==''?parseInt(mn.value):null,b=mx&&mx.value!==''?parseInt(mx.value):null;
      val={t:'num',min:isNaN(a)?null:a,max:isNaN(b)?null:b};break;
    }
    case 'PDX':{
      const ps=document.getElementById('vi-ps'),pe=document.getElementById('vi-pe');
      const s=parseInt(ps?.value)||1,e=pe&&pe.value!==''?parseInt(pe.value):null;
      val={t:'pdx',s,e:isNaN(e)?null:e};break;
    }
  }
  return{val,neg};
}

// ─── Event Handling ────────────────────────────────────────────────────────

document.addEventListener('click',e=>{
  // Theme toggle (outside delegation since it re-renders)
  if(e.target.id==='theme-btn'){cycleTheme();return;}
  // Close modal on backdrop
  const ov=document.getElementById('modal-ov');
  if(ov&&e.target===ov){setState({shOpen:false});return;}

  const t=e.target.closest('[data-a]');
  if(!t)return;
  const a=t.dataset.a;

  switch(a){
    case 'clear-all':setState({root:emptyRoot(),str:'',shOpen:false});break;

    case 'parse-str':{
      const inp=document.getElementById('paste-input')?.value.trim();
      if(!inp)return;
      try{const r=parser.parse(inp);setState({root:r,str:serRoot(r)});showToast(`Parsed ${countFilters(r)} filter(s)`);}
      catch(err){showToast('Parse error: '+err.message);}
      break;
    }

    case 'tog-op':{
      const gid=t.dataset.gid;
      updRoot(root=>{
        if(root.id===gid)return{...root,op:root.op==='AND'?'OR':'AND'};
        return replaceNode(root,gid,n=>({...n,op:n.op==='AND'?'OR':'AND'}));
      });break;
    }

    case 'tog-neg':{
      const nid=t.dataset.nid;
      updRoot(root=>{
        if(root.id===nid)return{...root,neg:!root.neg};
        return replaceNode(root,nid,n=>({...n,neg:!n.neg}));
      });break;
    }

    case 'mv-up':{const nid=t.dataset.nid;const i=findIdx(ST.root,nid);if(i>0)updRoot(r=>reorderIn(r,nid,i-1));break;}
    case 'mv-dn':{const nid=t.dataset.nid;const i=findIdx(ST.root,nid);updRoot(r=>reorderIn(r,nid,i+1));break;}
    case 'remove':{updRoot(r=>removeNode(r,t.dataset.nid));break;}

    case 'add-filter':
      setState({shOpen:true,shMode:'add',shParent:t.dataset.gid,shNodeId:null,shStep:1,shDef:null,shVal:null,shNeg:false,shCat:null});break;

    case 'add-group':{const g=mkGroup('AND');updRoot(r=>addChild(r,t.dataset.gid,g));break;}

    case 'edit-f':{
      const node=findNode(ST.root,t.dataset.nid);if(!node)break;
      const def=findDef(node.defId);
      setState({shOpen:true,shMode:'edit',shNodeId:t.dataset.nid,shParent:null,shStep:2,shDef:def,shVal:node.val,shNeg:node.neg,shCat:null});break;
    }

    case 'close-sh':setState({shOpen:false});break;
    case 'set-cat':setState({shCat:t.dataset.cat||null});break;
    case 'pick-def':{const def=findDef(t.dataset.did);setState({shStep:2,shDef:def,shVal:defVal(def)});break;}
    case 'pick-enum':setState({shVal:{...ST.shVal,k:t.dataset.k}});break;
    case 'back-pick':setState({shStep:1});break;

    case 'confirm':{
      const{val,neg}=collectVal();
      if(ST.shMode==='add'){updRoot(r=>addChild(r,ST.shParent,mkFilter(ST.shDef.id,val,neg)));}
      else{const nid=ST.shNodeId;updRoot(r=>replaceNode(r,nid,n=>({...n,defId:ST.shDef.id,val,neg})));}
      setState({shOpen:false});break;
    }

    case 'copy-str':{
      if(!ST.str)return;
      const fn=()=>{const ta=document.createElement('textarea');ta.value=ST.str;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);};
      if(navigator.clipboard){navigator.clipboard.writeText(ST.str).then(()=>showToast('Copied!')).catch(fn);}
      else{fn();showToast('Copied!');}
      break;
    }
  }
});

// ─── Pokéball home-screen icon ─────────────────────────────────────────────

function setupIcon(){
  const c=document.createElement('canvas');c.width=180;c.height=180;
  const x=c.getContext('2d');
  x.beginPath();x.arc(90,90,90,0,Math.PI*2);x.fillStyle='#fff';x.fill();
  x.beginPath();x.arc(90,90,90,Math.PI,0);x.fillStyle='#EE1515';x.fill();
  x.fillStyle='#1a1a1a';x.fillRect(0,80,180,20);
  x.beginPath();x.arc(90,90,24,0,Math.PI*2);x.fillStyle='#1a1a1a';x.fill();
  x.beginPath();x.arc(90,90,15,0,Math.PI*2);x.fillStyle='#fff';x.fill();
  x.beginPath();x.arc(90,90,88,0,Math.PI*2);x.strokeStyle='#1a1a1a';x.lineWidth=4;x.stroke();
  const lnk=document.createElement('link');lnk.rel='apple-touch-icon';lnk.href=c.toDataURL('image/png');
  document.head.appendChild(lnk);
}

// ─── Init ──────────────────────────────────────────────────────────────────

setupIcon();
render();
</script>
